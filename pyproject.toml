[project]
name = "jobdevs"
version = "1.0.0"
description = "JobDevs — Plataforma de Gestión de Talento y Proyectos SENA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0.0",
    "psycopg[binary]>=3.2",
    "python-dotenv",
    "pillow",
    "gunicorn>=22.0.0",
    "django-tailwind>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "playwright",
    "ruff",
    "django-tailwind[cookiecutter,honcho,reload]>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "usuarios", "proyectos", "postulaciones", "contrataciones", "disputas", "mensajes", "notificaciones", "avances", "logs", "favoritos"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-p", "no:warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end browser tests (requires Playwright)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "staticfiles",
    "media",
    ".venv",
]

[tool.ruff.lint]
select = ["F"]           # Pyflakes: errores reales (imports rotos, variables no definidas)
ignore = ["F401", "F403", "F841"] # Ignorar re-exports y variables no usadas en tests viejos
