name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Requerido para autenticación OIDC con Azure
  contents: read

concurrency:
  group: deploy-azure-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticación en Azure vía OIDC (Federated Identity)
        id: azure-login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Construir y subir imagen a Azure Container Registry (ACR)
        run: |
          echo "Compilando imagen Docker en ACR..."
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image jobdevs:${{ github.sha }} \
            --image jobdevs:latest \
            --file Dockerfile .

      - name: Desplegar en Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.AZURE_ACR_NAME }}
          containerAppName: ${{ secrets.AZURE_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/jobdevs:${{ github.sha }}

      - name: Aplicar migraciones de Django en Azure
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Aplicando migraciones en la revisión activa..."
            az containerapp exec \
              --name ${{ secrets.AZURE_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --command "python manage.py migrate --noinput" || true

      - name: Notificar despliegue a DataDog (Deployment Marker)
        if: ${{ env.DD_API_KEY != '' }}
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_SITE: ${{ secrets.DATADOG_SITE || 'datadoghq.com' }}
        run: |
          echo "Enviando evento de despliegue a DataDog..."
          TIMESTAMP=$(date +%s)
          curl -s -X POST "https://api.${DD_SITE}/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d '{
              "title": "Despliegue JobDevs en Azure Container Apps",
              "text": "Se desplegó el commit '"${{ github.sha }}"' en producción.",
              "priority": "normal",
              "tags": ["service:jobdevs", "env:production", "version:${{ github.sha }}"],
              "alert_type": "info",
              "date_happened": '"${TIMESTAMP}"'
            }' > /dev/null || echo "Aviso DataDog completado"
