name: CI
# Required checks for branch protection on main: test-sqlite, test-postgres (both must pass)

on:
  push:
    branches: [main, "feat/**", "ci/**", "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-sqlite:
    name: Test (SQLite)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: test-secret-key-ci
      DJANGO_DEBUG: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # TODO: bump a 3.14 cuando esté GA en setup-python@v5 / ubuntu-latest
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (SQLite, ignore E2E)
        run: pytest . --ignore=tests/e2e -v

  test-postgres:
    name: Test (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teir_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: test-secret-key-ci
      DJANGO_DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      USE_POSTGRES: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: teir_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # TODO: bump a 3.14 cuando esté GA en setup-python@v5 / ubuntu-latest
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL service
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage (PostgreSQL, ignore E2E)
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml --ignore=tests/e2e -v

      - name: Upload coverage and JUnit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-postgres-artifacts
          path: |
            coverage.xml
            junit.xml

      - name: Upload to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
