name: CI
# Required checks for branch protection on main: test-sqlite, test-postgres (both must pass)
# test-e2e (RNF-12) verifica la interfaz en Chrome, Firefox y Edge. Para que bloquee
# merges debe añadirse a la branch protection (requiere permisos de admin del repo).

on:
  push:
    branches: [main, "feat/**", "ci/**", "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-sqlite:
    name: Test (SQLite)
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: test-secret-key-ci
      DJANGO_DEBUG: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run linter (Ruff)
        run: uv run ruff check .

      - name: Run tests (SQLite, ignore E2E)
        run: uv run pytest . --ignore=tests/e2e -v

  test-postgres:
    name: Test (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teir_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: test-secret-key-ci
      DJANGO_DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      USE_POSTGRES: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: teir_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Wait for PostgreSQL service
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      # -------------------- RNF-14: respaldo y recuperación --------------------
      - name: Verificar que las migraciones reflejen los modelos (RNF-14)
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Verificar respaldo y restauración en servidor nuevo (RNF-14)
        run: |
          echo "Cliente PostgreSQL disponible:"
          pg_dump --version
          pg_restore --version
          mkdir -p /tmp/respaldos
          uv run python manage.py backup_db --output-dir /tmp/respaldos
          RESPALDO=$(ls /tmp/respaldos/*.dump | head -1)
          echo "Restaurando $RESPALDO en una base de datos nueva..."
          uv run python manage.py verify_db_recovery \
            --desde-dump "$RESPALDO" \
            --json-out recuperacion-respaldo.json

      - name: Verificar reconstrucción del esquema desde cero < 5 min (RNF-14)
        run: |
          uv run python manage.py verify_db_recovery \
            --objetivo 300 \
            --json-out recuperacion-esquema.json

      - name: Run tests with coverage (PostgreSQL, ignore E2E)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml --ignore=tests/e2e -v

      - name: Upload coverage and JUnit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-postgres-artifacts
          path: |
            coverage.xml
            junit.xml
            recuperacion-*.json

      - name: Upload to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Un fallo en un navegador no debe ocultar el resultado de los demás.
      fail-fast: false
      matrix:
        include:
          # Chrome y Edge corren con los binarios del sistema que ya traen los
          # runners de GitHub (channel 'chrome' / 'msedge').
          - browser: chrome
            playwright_install: ''
          # Firefox se instala con Playwright (--with-deps trae las librerías del sistema).
          - browser: firefox
            playwright_install: firefox
          - browser: edge
            playwright_install: ''
    env:
      DJANGO_SECRET_KEY: test-secret-key-ci
      DJANGO_DEBUG: "True"
      E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Install Playwright browsers
        if: matrix.playwright_install != ''
        run: uv run playwright install --with-deps ${{ matrix.playwright_install }}

      - name: Run E2E tests (${{ matrix.browser }})
        run: uv run pytest tests/e2e -m e2e -v
