{% load i18n %}
<div class="candidatos-panel" data-candidato-panel>
  <div class="candidatos-buscador" role="search">
    <div class="candidatos-buscador-campo">
      <i data-lucide="search" aria-hidden="true"></i>
      <label class="sr-only" for="{{ prefijo }}CandidatoBusqueda">{% trans "Buscar candidatos" %}</label>
      <input type="search"
             id="{{ prefijo }}CandidatoBusqueda"
             class="form-input candidatos-buscador-input"
             placeholder="{% trans 'Buscar por nombre, ficha SENA o habilidad...' %}"
             autocomplete="off"
             data-candidato-input>
      <button type="button"
              class="candidatos-buscador-limpiar"
              data-candidato-limpiar
              hidden
              aria-label="{% trans 'Limpiar búsqueda' %}">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>
    <span id="{{ prefijo }}CandidatoContador"
          class="candidatos-contador"
          aria-live="polite"
          data-candidato-contador></span>
  </div>
  <p id="{{ prefijo }}CandidatoSinResultados"
     class="candidatos-vacio"
     role="status"
     aria-live="polite"
     data-candidato-vacio
     hidden>
    {% trans "No encontramos candidatos que coincidan con" %} «<span data-candidato-termino></span>». {% trans "Prueba con otro nombre, ficha o habilidad." %}
  </p>
</div>
