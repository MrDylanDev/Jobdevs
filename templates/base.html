{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobDevs | Plataforma{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'IMG/JobDevs_logo_vector_transparente.svg' %}" type="image/svg+xml">
    <script>
      (function() {
        var tema = 'dark';
        try {
          var guardado = localStorage.getItem('jobdevs-theme');
          if (guardado === 'light' || guardado === 'dark') {
            tema = guardado;
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'dashboard/css/dashboard_modals.css' %}?v=20261121_v25">
    <!-- Bootstrap y fuentes comunes (con SRI para seguridad) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
    <script src="{% static 'dashboard/script/dashboard_modals.js' %}?v=20261121_v21"></script>
    <script src="{% static 'dashboard/script/file_validator_async.js' %}"></script>
    {% if request.user.is_authenticated %}
    <script src="{% static 'dashboard/script/notificaciones_sse.js' %}"></script>
    {% endif %}
    {% block extra_js %}{% endblock %}
    <script>
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    </script>
</body>
</html>
