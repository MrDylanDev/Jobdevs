{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobDevs | Gestionar Equipos</title>
  <link rel="shortcut icon" href="{% static 'IMG/JobDevs_logo_vector_transparente.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/dashboard_modals.css' %}?v=20261121_v25">
  <link rel="stylesheet" href="{% static 'dashboard/css/modules/modals_content.css' %}?v=20261121_v25">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="{% static 'IMG/JobDevs_logo_vector_transparente.svg' %}" alt="JobDevs">
      <div>
        <div class="sidebar-brand-text">JobDevs</div>
        <div class="sidebar-brand-sub">Equipos</div>
      </div>
    </div>
    <div class="sidebar-group" style="padding-top:20px;">
      <a class="nav-item" href="{% url 'gestionar_hitos' proyecto.id %}"><i data-lucide="arrow-left"></i><span>Volver a Hitos</span></a>
      <a class="nav-item" href="{% url 'dashboard_empresa' %}"><i data-lucide="home"></i><span>Panel Empresa</span></a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="top-header">
      <div class="top-header-title">Equipos <span>/ {{ proyecto.titulo }}</span></div>
    </header>
    <main class="main-content">

      <div class="page-header">
        <div>
          <div class="page-title"><i style="margin-right:10px; color:var(--text-muted);" data-lucide="users"></i>Grupos y Parejas de Trabajo</div>
          <div class="page-subtitle">Organiza tus desarrolladores en equipos para asignarles hitos específicos</div>
        </div>
      </div>

      {% include 'proyectos/partials/_equipos_panel.html' %}
    </main>
  </div>
</div>
<script src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
<script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
<script src="{% static 'dashboard/script/htmx_bridge.js' %}" defer></script>
<script>
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
</script>
<script type="module" src="{% static 'dashboard/script/dashboard_modals.js' %}?v=20261126_mod1"></script>
</body>
</html>
