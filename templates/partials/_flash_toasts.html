{% if messages %}
  <div id="jdFlashToastStack" style="position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; max-width:380px;">
    {% for message in messages %}
      <div class="jd-flash-toast {% if message.tags and 'error' in message.tags or message.tags and 'danger' in message.tags %}is-error{% endif %}"
           role="status"
           style="display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--corp-surface, var(--card-bg, #16181c)); color:var(--corp-slate-900, var(--text-primary, #fafafa)); border:1px solid var(--corp-border, var(--border, #2c3038)); border-left:3px solid {% if message.tags and 'error' in message.tags or message.tags and 'danger' in message.tags %}var(--corp-danger, var(--danger, #ef4444)){% else %}var(--corp-brand, var(--accent, #00713f)){% endif %}; border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,0.18); font-size:13px; font-weight:600; transition:opacity 250ms ease, transform 250ms ease;">
        <i data-lucide="{% if message.tags and 'error' in message.tags or message.tags and 'danger' in message.tags %}alert-circle{% else %}check-circle-2{% endif %}"
           style="width:16px; height:16px; flex-shrink:0; color:{% if message.tags and 'error' in message.tags or message.tags and 'danger' in message.tags %}var(--corp-danger, var(--danger, #ef4444)){% else %}var(--corp-brand, var(--accent, #00713f)){% endif %};"></i>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
  <script>
    setTimeout(function () {
      var stack = document.getElementById('jdFlashToastStack');
      if (!stack) return;
      stack.querySelectorAll('.jd-flash-toast').forEach(function (t) {
        t.style.opacity = '0';
        t.style.transform = 'translateY(8px)';
      });
      setTimeout(function () {
        if (stack.parentNode) stack.parentNode.removeChild(stack);
      }, 260);
    }, 3500);
  </script>
{% endif %}
