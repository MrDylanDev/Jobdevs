{% load static i18n %}
<!-- ==================== EMPRESAS QUE CONFÍAN (CARRUSEL CONTINUO) ==================== -->
<section id="empresas" class="section-tech logos-marquee-section" aria-labelledby="tituloEmpresas">
  <div class="logos-grid-bg" aria-hidden="true"></div>

  <div class="section-inner logos-marquee-head reveal">
    <span class="section-marker"><span>{% trans "CONFIANZA CORPORATIVA" %}</span></span>
    <h2 class="sh-title" id="tituloEmpresas">{% trans "Empresas que" %} <span class="acento-marca">{% trans "confían en nosotros" %}</span></h2>
    <p class="desc-mono">{% trans "Compañías colombianas que ya construyen su software con aprendices y egresados SENA verificados a través de Jobdevs." %}</p>
  </div>

  <div class="logos-marquee">
    <div class="logos-marquee-fade logos-marquee-fade--left" aria-hidden="true"></div>
    <div class="logos-marquee-fade logos-marquee-fade--right" aria-hidden="true"></div>

    <div class="logos-marquee-viewport">
      <!-- Pista visible -->
      <div class="logos-marquee-track" role="list" aria-label="{% trans "Empresas colombianas que contratan talento SENA" %}">
        <span class="logos-wordmark is-standard">
          <img src="{% static 'IMG/logos/alpina.svg' %}" alt="{% trans "Logo de Alpina" %}" decoding="async">
        </span>
        <span class="logos-wordmark is-square">
          <img src="{% static 'IMG/logos/bavaria.svg' %}" alt="{% trans "Logo de Bavaria" %}" decoding="async">
        </span>

        </span>

        </span>

        </span>
        <span class="logos-wordmark is-standard">
