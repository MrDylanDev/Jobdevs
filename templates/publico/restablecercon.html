{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | JobDevs</title>
    <link rel="shortcut icon" href="{% static 'IMG/JobDevs_logo_vector_transparente.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'publico/css/restablecercon.css' %}">
</head>
<body>
    <div class="container">
        <div class="logo">JobDevs</div>

        <form class="form" method="post" action="{% url 'restablecer' token %}">
            {% csrf_token %}

            <div class="form-header">
                <h2>Elige una nueva contraseña</h2>
                <p>Ingresa tu nueva contraseña para acceder a la plataforma.</p>
            </div>

            {% include 'partials/_flash_toasts.html' %}

            <div class="field">
                <input type="password" name="password" placeholder="Nueva contraseña" required minlength="8">
                <label>Nueva contraseña</label>
            </div>

            <div class="field">
                <input type="password" name="password_confirm" placeholder="Confirma tu contraseña" required minlength="8">
                <label>Confirmar contraseña</label>
            </div>

            <button type="submit">Restablecer contraseña</button>

            <div class="extra">
                <a href="{% url 'inicio' %}">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>
</body>
</html>
