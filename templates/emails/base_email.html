<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ asunto|default:"Notificación JobDevs" }}</title>
  <style>
    /* Estilos base para clientes de correo — Piel Técnica JobDevs */
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #cbd5e1;
      -webkit-font-smoothing: antialiased;
    }
    table {
      border-spacing: 0;
      border-collapse: collapse;
    }
    td {
      padding: 0;
    }
    img {
      border: 0;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #050505;
      padding: 36px 12px;
    }
    .main {
      background-color: #0a0a0a;
      margin: 0 auto;
      width: 100%;
      max-width: 580px;
      border: 1px solid #1f2421;
    }
    .header {
      background-color: #000000;
      border-bottom: 1px solid #1a1a1a;
      padding: 24px 32px;
      text-align: left;
    }
    .header-logo {
      font-family: 'Courier New', Courier, monospace;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-decoration: none;
      display: inline-block;
    }
    .content {
      padding: 36px 32px;
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .footer {
      background-color: #000000;
      border-top: 1px solid #1a1a1a;
      padding: 24px 32px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      font-family: 'Courier New', Courier, monospace;
    }
    .btn-cta {
      display: inline-block;
      background-color: #00e676;
      color: #000000 !important;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-decoration: none;
      padding: 14px 28px;
      border: 1px solid #00e676;
      border-radius: 0px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div style="display:none;font-size:1px;color:#050505;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">
    {% block email_preheader %}Notificación importante de JobDevs{% endblock %}
  </div>
  <center class="wrapper">
    <table class="main" width="100%">
      <!-- Header -->
      <tr>
        <td class="header">
          <table width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td>
                <div class="header-logo">
                  <span style="display:inline-block; width:10px; height:10px; background-color:#00e676; margin-right:8px; vertical-align:middle;"></span>JobDevs
                </div>
              </td>
              <td align="right">
                <span style="font-family:'Courier New', monospace; font-size:10px; color:#555555; letter-spacing:0.1em; text-transform:uppercase;">// ECOSISTEMA_SENA</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <!-- Body Content -->
      <tr>
        <td class="content">
          {% block email_content %}{% endblock %}
        </td>
      </tr>

      <!-- Footer -->
      <tr>
        <td class="footer">
          <p style="margin: 0 0 6px 0; color: #888888;">Mensaje transaccional automático emitido por <strong>JobDevs</strong>.</p>
          <p style="margin: 0; color: #555555;">Servicio Nacional de Aprendizaje (SENA) &copy; 2026. Medellín, Colombia.</p>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
