# ============================================================
# JobDevs - Docker Compose
# Orquestación: PostgreSQL 16 + Django/Gunicorn + Nginx
# ============================================================

services:

  # -------------------- Base de Datos --------------------
  db:
    image: postgres:16-alpine
    container_name: teir_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-teir_db}
      POSTGRES_USER: ${DB_USER:-teir_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teir_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Solo accesible localmente para evitar exposición en interfaces externas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teir_user} -d ${DB_NAME:-teir_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - teir_network

  # -------------------- Redis (Caché en RAM y Channel Layer) --------------------
  redis:
    image: redis:7-alpine
    container_name: teir_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Aislado al host local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - teir_network

  # -------------------- Aplicación Django --------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teir_web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-teir_user}
      - DB_PASSWORD=${DB_PASSWORD:-teir_password}
      - DB_NAME=${DB_NAME:-teir_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - teir_network

  # -------------------- Mailpit (Servidor SMTP y Web UI local - SCRUM-197) --------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: teir_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI
    networks:
      - teir_network

  # -------------------- Celery Background Worker (SCRUM-197) --------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teir_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-teir_user}
      - DB_PASSWORD=${DB_PASSWORD:-teir_password}
      - DB_NAME=${DB_NAME:-teir_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
    volumes:
      - media_files:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - teir_network

  # -------------------- Respaldos automáticos (RNF-14) --------------------
  # Contenedor de un solo propósito: respalda la base de datos a diario en el
  # volumen `backup_files`, verifica la integridad del archivo, aplica la
  # política de retención y registra el resultado en la tabla copias_seguridad.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teir_backup
    restart: unless-stopped
    # Se invoca con bash para no depender del permiso de ejecución del archivo.
    entrypoint: ["bash", "/app/docker/backup/scheduler.sh"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-teir_user}
      - DB_PASSWORD=${DB_PASSWORD:-teir_password}
      - DB_NAME=${DB_NAME:-teir_db}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_BACKUP_DIR=/app/backups
      - BACKUP_HOUR=${BACKUP_HOUR:-3}
      - BACKUP_MINUTE=${BACKUP_MINUTE:-0}
      - BACKUP_ON_START=${BACKUP_ON_START:-0}
      - BACKUP_RETENTION_DAILY_DAYS=${BACKUP_RETENTION_DAILY_DAYS:-7}
      - BACKUP_RETENTION_TOTAL_DAYS=${BACKUP_RETENTION_TOTAL_DAYS:-30}
      - DB_RECOVERY_TARGET_SECONDS=${DB_RECOVERY_TARGET_SECONDS:-300}
    volumes:
      - backup_files:/app/backups
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - teir_network

  # -------------------- Nginx Reverse Proxy --------------------
  nginx:
    image: nginx:alpine
    container_name: teir_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - teir_network

# -------------------- Volúmenes Persistentes --------------------
volumes:
  postgres_data:
    driver: local
    name: teir_postgres_data
  redis_data:
    driver: local
    name: teir_redis_data
  static_files:
    driver: local
    name: teir_static_files
  media_files:
    driver: local
    name: teir_media_files
  backup_files:
    driver: local
    name: teir_backup_files

# -------------------- Red Interna --------------------
networks:
  teir_network:
    driver: bridge
    name: teir_network
