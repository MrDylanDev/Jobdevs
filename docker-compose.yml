# ============================================================
# TEIR - Docker Compose
# Orquestación: PostgreSQL 16 + Django/Gunicorn + Nginx
# ============================================================

services:

  # -------------------- Base de Datos --------------------
  db:
    image: postgres:16-alpine
    container_name: teir_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-teir_db}
      POSTGRES_USER: ${DB_USER:-teir_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teir_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Solo accesible localmente para evitar exposición en interfaces externas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teir_user} -d ${DB_NAME:-teir_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - teir_network

  # -------------------- Aplicación Django --------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teir_web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-teir_user}
      - DB_PASSWORD=${DB_PASSWORD:-teir_password}
      - DB_NAME=${DB_NAME:-teir_db}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - teir_network

  # -------------------- Nginx Reverse Proxy --------------------
  nginx:
    image: nginx:alpine
    container_name: teir_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - teir_network

# -------------------- Volúmenes Persistentes --------------------
volumes:
  postgres_data:
    driver: local
    name: teir_postgres_data
  static_files:
    driver: local
    name: teir_static_files
  media_files:
    driver: local
    name: teir_media_files

# -------------------- Red Interna --------------------
networks:
  teir_network:
    driver: bridge
    name: teir_network
